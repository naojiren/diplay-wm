plugins {
    id 'com.android.library'
}
// Match the application filter so unused native targets are not built either.
def wmUniversalAbis = providers.gradleProperty('wmUniversalAbis')
        .map { value ->
            if (!(value in ['true', 'false'])) {
                throw new GradleException('wmUniversalAbis must be true or false')
            }
            value == 'true'
        }.getOrElse(false)

android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 19
        targetSdk = 37
        multiDexEnabled true

        ndk {
            abiFilters.addAll(wmUniversalAbis
                    ? ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
                    : ['armeabi-v7a'])
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-19'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // NDK r25c is the last supported toolchain that still targets Android 4.4 (API 19).
    ndkVersion = '25.2.9519653'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
}

// Small ARMv7 helper for this Android 6 head unit. Kept as an asset, never loaded as JNI.
// It uses the existing su only during a wireless lease and restores the radio snapshot.
def wmNetworkAssets = layout.buildDirectory.dir('generated/wmNetworkGuardAssets')
def wmNdkDirectory = androidComponents.sdkComponents.ndkDirectory
def wmNetworkCompilerHost = System.getProperty('os.name').toLowerCase().contains('windows')
        ? 'windows-x86_64' : (System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64' : 'linux-x86_64')
def buildWmNetworkGuard = tasks.register('buildWmNetworkGuard', Exec) {
    inputs.files('src/main/jni/wm_network_guard.c', 'src/main/jni/wm_network_guard_policy.h')
    outputs.file(wmNetworkAssets.map { it.file('wm-network-guard-armv7') })
    doFirst {
        def output = wmNetworkAssets.get().file('wm-network-guard-armv7').asFile
        output.parentFile.mkdirs()
        def compiler = new File(wmNdkDirectory.get().asFile,
                "toolchains/llvm/prebuilt/${wmNetworkCompilerHost}/bin/armv7a-linux-androideabi23-clang" +
                        (wmNetworkCompilerHost.startsWith('windows') ? '.cmd' : ''))
        commandLine compiler, '-std=c11', '-Wall', '-Wextra', '-Werror', '-O2', '-fPIE', '-pie',
                file('src/main/jni/wm_network_guard.c'), '-o', output
    }
}
android.sourceSets.main.assets.srcDir(wmNetworkAssets.get().asFile)
tasks.named('preBuild').configure { dependsOn(buildWmNetworkGuard) }

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation libs.bouncycastle
    // A private video-only provider; 2.5.3 retains Android 4.4 support and all four ABIs.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.mockito:mockito-core:5.20.0'
}
