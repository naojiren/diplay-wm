plugins {
    id 'com.android.library'
}
// Match the application filter so unused native targets are not built either.
def wmUniversalAbis = providers.gradleProperty('wmUniversalAbis')
        .map { value ->
            if (!(value in ['true', 'false'])) {
                throw new GradleException('wmUniversalAbis must be true or false')
            }
            value == 'true'
        }.getOrElse(false)

android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 19
        targetSdk = 37
        multiDexEnabled true

        ndk {
            abiFilters.addAll(wmUniversalAbis
                    ? ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
                    : ['armeabi-v7a'])
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-19'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // NDK r25c is the last supported toolchain that still targets Android 4.4 (API 19).
    ndkVersion = '25.2.9519653'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
}
dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation libs.bouncycastle
    // A private video-only provider; 2.5.3 retains Android 4.4 support and all four ABIs.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.mockito:mockito-core:5.20.0'
}
